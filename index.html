<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOIATO Web Control Pro - Simulação Completa</title>
    <!-- Biblioteca Chart.js corrigida -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* --- ESTILIZAÇÃO VISUAL (INTERFACE DO USUÁRIO) --- */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: #0f111a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .sub-title {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status-simulacao {
            background: #334155;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
            color: #fbbf24;
        }
        .grid-topo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 {
            margin: 0 0 15px 0;
            color: #f8fafc;
            font-size: 22px;
            letter-spacing: 0.5px;
        }
        .timer {
            font-weight: 700;
            font-size: 2em;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 70px;
            padding: 12px 15px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
        }
        .btn-off {
            background: #ef4444;
            color: #ffffff;
        }
        .btn-off:hover {
            background: #dc2626;
        }
        .card-niveis {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
            border: 1px solid #38bdf8;
            margin-bottom: 40px;
        }
        .card-niveis h2 {
            margin: 0 0 20px 0;
            color: #38bdf8;
            font-size: 24px;
        }
        .niveis-flex {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .tanque-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
        }
        .tanque-visual {
            width: 80px;
            height: 120px;
            border: 4px solid #64748b;
            border-radius: 0 0 12px 12px;
            position: relative;
            background: #334155;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .agua {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(0deg, #1d4ed8 0%, #3b82f6 100%);
            transition: height 1s ease-in-out;
            box-shadow: 0 -2px 10px rgba(59, 130, 246, 0.5);
        }
        .tanque-label {
            margin-top: 12px;
            font-size: 18px;
            font-weight: 600;
        }
        .tanque-percent {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 4px;
        }
        .alerta-nivel {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
        }
        .alerta-baixo {
            background: #ef4444;
            color: white;
        }
        .alerta-alto {
            background: #10b981;
            color: white;
        }
        .secao-graficos h2 {
            font-size: 24px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        .grid-graficos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card-grafico {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .card-grafico h4 {
            margin: 0 0 15px 0;
            color: #f8fafc;
            font-size: 16px;
            text-align: center;
            font-weight: 600;
        }
        .canvas-container {
            position: relative;
            height: 220px;
            width: 100%;
        }
        .legenda-cores {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #334155;
            font-size: 12px;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cor-legenda {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .btn-reset-simulacao {
            background: #f59e0b;
            margin-top: 20px;
            padding: 10px 20px;
        }
        .btn-reset-simulacao:hover {
            background: #d97706;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BOIATO Web Control Pro</h1>
    <div class="sub-title">Painel Inteligente de Monitoramento e Relés</div>
    <div class="status-simulacao">🔄 MODO SIMULAÇÃO ATIVO - Dados gerados automaticamente</div>

    <!-- SEÇÃO 1: FONTES DE ALIMENTAÇÃO (DISPOSITIVOS ATUADORES) -->
    <div class="grid-topo">
        <div class="card">
            <h3>🚰 Controle da Bomba</h3>
            <p class="timer" id="display-bomba" style="color: #ef4444;">Desligado</p>
            <div class="btn-group">
                <button class="btn" onclick="adicionarTempo('Bomba', 1)">+1 Min</button>
                <button class="btn" onclick="adicionarTempo('Bomba', 15)">+15 Min</button>
                <button class="btn btn-off" onclick="desligar('Bomba')">OFF</button>
            </div>
        </div>

        <div class="card">
            <h3>⚡ Concessionária</h3>
            <p class="timer" id="display-concessionaria" style="color: #ef4444;">Desligado</p>
            <div class="btn-group">
                <button class="btn" onclick="adicionarTempo('Concessionaria', 60)">+1 Hora</button>
                <button class="btn" onclick="adicionarTempo('Concessionaria', 1440)">+1 Dia</button>
                <button class="btn btn-off" onclick="desligar('Concessionaria')">OFF</button>
            </div>
        </div>
    </div>

    <!-- SEÇÃO 2: ARMAZENAMENTO / RESERVATÓRIOS (CASA e COZINHA invertidos) -->
    <div class="card-niveis">
        <h2>💧 Nível dos Reservatórios</h2>
        <div class="niveis-flex">
            <!-- Primeiro: Casa -->
            <div class="tanque-wrapper">
                <div class="tanque-visual">
                    <div class="agua" id="agua-casa" style="height: 90%;"></div>
                </div>
                <div class="tanque-label">Casa</div>
                <div class="tanque-percent" id="percent-casa">90%</div>
            </div>
            <!-- Segundo: Cozinha -->
            <div class="tanque-wrapper">
                <div class="tanque-visual">
                    <div class="agua" id="agua-cozinha" style="height: 75%;"></div>
                </div>
                <div class="tanque-label">Cozinha</div>
                <div class="tanque-percent" id="percent-cozinha">75%</div>
            </div>
        </div>
        <div id="alertas" class="alerta-nivel" style="display: none;"></div>
    </div>

    <!-- SEÇÃO 3: HISTÓRICO DE CONSUMO -->
    <div class="secao-graficos">
        <h2>📊 Histórico de Consumo - Últimos 7 Dias</h2>
        <div class="grid-graficos" id="graficos-container"></div>
        <button class="btn btn-reset-simulacao" onclick="resetarSimulacao()">🔄 Resetar Simulação</button>
    </div>
</div>

<script>
    // ==========================================
    // VARIÁVEIS GLOBAIS
    // ==========================================
    
    let tempos = {
        Bomba: localStorage.getItem('tempoBomba') ? parseInt(localStorage.getItem('tempoBomba')) : 0,
        Concessionaria: localStorage.getItem('tempoConcessionaria') ? parseInt(localStorage.getItem('tempoConcessionaria')) : 0
    };
    
    // Dados simulados dos níveis das caixas d'água (0-100%)
    let niveis = {
        casa: 90,
        cozinha: 75
    };
    
    // Histórico simulado de consumo (últimos 7 dias, 8 medições por dia)
    let historicoConsumo = {};
    let historicoCasa = {};
    let historicoCozinha = {};
    let charts = {};
    
    // Horários das medições (3 em 3 horas)
    const horarios = ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00'];
    const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    
    // Capacidade máxima dos reservatórios em litros
    const capacidadeCasa = 1500;
    const capacidadeCozinha = 800;
    
    // ==========================================
    // FUNÇÕES DE SIMULAÇÃO DE DADOS
    // ==========================================
    
    // Gera dados realistas de consumo para um dia específico (para cada reservatório)
    function gerarConsumoDia(dia, reservatorio) {
        let dados = [];
        let baseConsumo = reservatorio === 'cozinha' ? 800 : 1200; // litros base
        
        // Variação por dia da semana
        let fatorDia = 1;
        if (dia === 5 || dia === 6) fatorDia = 1.3; // Fim de semana consome mais
        if (dia === 0) fatorDia = 0.8; // Segunda consome menos
        
        for (let i = 0; i < horarios.length; i++) {
            let hora = i * 3;
            let consumo;
            
            if (hora >= 6 && hora <= 9) consumo = 100 * fatorDia; // Pico matinal
            else if (hora >= 18 && hora <= 21) consumo = 130 * fatorDia; // Pico noturno
            else if (hora >= 12 && hora <= 15) consumo = 70 * fatorDia; // Médio
            else consumo = 25 * fatorDia; // Baixo consumo noturno
            
            // Variação por reservatório
            if (reservatorio === 'casa') consumo = consumo * 1.5;
            
            // Adiciona variação aleatória (±15%)
            consumo = consumo * (0.85 + Math.random() * 0.3);
            
            // Converte para percentual do reservatório
            let capacidade = reservatorio === 'casa' ? capacidadeCasa : capacidadeCozinha;
            let percentual = (consumo / capacidade) * 100;
            percentual = Math.min(100, Math.max(0, percentual));
            
            dados.push(Math.round(percentual));
        }
        return dados;
    }
    
    // Inicializa o histórico com dados simulados
    function inicializarHistorico() {
        for (let i = 0; i < 7; i++) {
            historicoCasa[i] = gerarConsumoDia(i, 'casa');
            historicoCozinha[i] = gerarConsumoDia(i, 'cozinha');
            historicoConsumo[i] = {
                casa: historicoCasa[i],
                cozinha: historicoCozinha[i]
            };
        }
    }
    
    // Obtém a data no formato dd/mmm
    function getDataFormatada(diasAtras) {
        const data = new Date();
        data.setDate(data.getDate() - diasAtras);
        const dia = data.getDate().toString().padStart(2, '0');
        const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
        const mes = meses[data.getMonth()];
        return `${dia}/${mes}`;
    }
    
    // Obtém a ordem dos dias (do mais recente para o mais antigo)
    function getOrdemDias() {
        const ordem = [];
        for (let i = 1; i <= 7; i++) {
            ordem.push(i);
        }
        return ordem;
    }
    
    // Atualiza os gráficos com os dados atuais
    function inicializarGraficos() {
        const container = document.getElementById('graficos-container');
        if (!container) return;
        
        container.innerHTML = '';
        charts = {};
        
        const ordemDias = getOrdemDias();
        
        for (let idx = 0; idx < ordemDias.length; idx++) {
            const diasAtras = ordemDias[idx];
            const diaIndex = (new Date().getDay() - diasAtras + 7) % 7;
            const dataLabel = getDataFormatada(diasAtras);
            const nomeDia = diasSemana[diaIndex];
            
            // Cria o card do gráfico
            const card = document.createElement('div');
            card.className = 'card-grafico';
            card.innerHTML = `
                <h4>${dataLabel} - ${nomeDia}</h4>
                <div class="canvas-container">
                    <canvas id="chart-${idx}"></canvas>
                </div>
                <div class="legenda-cores">
                    <div class="legenda-item">
                        <div class="cor-legenda" style="background: #10b981;"></div>
                        <span>Casa</span>
                    </div>
                    <div class="legenda-item">
                        <div class="cor-legenda" style="background: #3b82f6;"></div>
                        <span>Cozinha</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
            
            const canvas = document.getElementById(`chart-${idx}`);
            if (!canvas) continue;
            
            const ctx = canvas.getContext('2d');
            
            charts[idx] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: horarios,
                    datasets: [
                        {
                            label: 'Casa',
                            data: historicoConsumo[diaIndex].casa,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.05)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: false,
                            pointBackgroundColor: '#10b981',
                            pointBorderColor: '#0f172a',
                            pointRadius: 3,
                            pointHoverRadius: 5
                        },
                        {
                            label: 'Cozinha',
                            data: historicoConsumo[diaIndex].cozinha,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.05)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: false,
                            pointBackgroundColor: '#3b82f6',
                            pointBorderColor: '#0f172a',
                            pointRadius: 3,
                            pointHoverRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false // Remove a legenda padrão do Chart.js
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.dataset.label}: ${context.parsed.y}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: '#334155' },
                            title: {
                                display: false // Remove qualquer título
                            },
                            ticks: {
                                color: '#94a3b8',
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        },
                        x: {
                            grid: { color: '#334155' },
                            ticks: { 
                                color: '#94a3b8',
                                font: { size: 9 },
                                rotation: 45
                            }
                        }
                    }
                }
            });
        }
    }
    
    // Simula o consumo de água baseado nos relés ativos
    function simularConsumo() {
        const agora = Date.now();
        let bombaAtiva = tempos.Bomba > agora;
        let concessionariaAtiva = tempos.Concessionaria > agora;
        
        // Se alguma fonte está ativa, enche as caixas
        if (bombaAtiva || concessionariaAtiva) {
            let vazao = 0;
            if (bombaAtiva && concessionariaAtiva) vazao = 15;
            else if (bombaAtiva) vazao = 8;
            else if (concessionariaAtiva) vazao = 12;
            
            niveis.casa = Math.min(100, niveis.casa + vazao * 0.05);
            niveis.cozinha = Math.min(100, niveis.cozinha + vazao * 0.07);
        }
        
        // Consumo normal das caixas (uso doméstico)
        let consumoMomentaneo = Math.random() * 3 + 2;
        niveis.casa = Math.max(0, niveis.casa - consumoMomentaneo * 0.12);
        niveis.cozinha = Math.max(0, niveis.cozinha - consumoMomentaneo * 0.08);
        
        // Atualiza display
        atualizarDisplayNiveis();
        verificarAlertas();
        
        // Registra o consumo no gráfico do dia atual (simula dados em tempo real)
        const dataAtual = new Date();
        const diaSemanaAtual = dataAtual.getDay();
        const horaAtual = dataAtual.getHours();
        const indiceHora = Math.floor(horaAtual / 3);
        
        if (historicoConsumo[diaSemanaAtual] && indiceHora < horarios.length) {
            // Adiciona pequenas variações em tempo real (convertendo nível atual para percentual de consumo)
            let consumoPercentualCasa = (100 - niveis.casa) * 0.5;
            let consumoPercentualCozinha = (100 - niveis.cozinha) * 0.5;
            
            consumoPercentualCasa += (Math.random() - 0.5) * 5;
            consumoPercentualCozinha += (Math.random() - 0.5) * 5;
            consumoPercentualCasa = Math.max(0, Math.min(100, consumoPercentualCasa));
            consumoPercentualCozinha = Math.max(0, Math.min(100, consumoPercentualCozinha));
            
            // Encontra qual gráfico está mostrando o dia atual
            const ordemDias = getOrdemDias();
            for (let idx = 0; idx < ordemDias.length; idx++) {
                const diasAtras = ordemDias[idx];
                const diaIndex = (dataAtual.getDay() - diasAtras + 7) % 7;
                if (diaIndex === diaSemanaAtual && charts[idx]) {
                    charts[idx].data.datasets[0].data[indiceHora] = Math.round(consumoPercentualCasa);
                    charts[idx].data.datasets[1].data[indiceHora] = Math.round(consumoPercentualCozinha);
                    charts[idx].update('none');
                    break;
                }
            }
        }
    }
    
    // Atualiza a interface dos níveis das caixas d'água
    function atualizarDisplayNiveis() {
        const aguaCasa = document.getElementById('agua-casa');
        const percentCasa = document.getElementById('percent-casa');
        const aguaCozinha = document.getElementById('agua-cozinha');
        const percentCozinha = document.getElementById('percent-cozinha');
        
        if (aguaCasa) aguaCasa.style.height = `${niveis.casa}%`;
        if (percentCasa) percentCasa.innerText = `${Math.round(niveis.casa)}%`;
        if (aguaCozinha) aguaCozinha.style.height = `${niveis.cozinha}%`;
        if (percentCozinha) percentCozinha.innerText = `${Math.round(niveis.cozinha)}%`;
    }
    
    // Verifica e exibe alertas de nível crítico
    function verificarAlertas() {
        const alertaDiv = document.getElementById('alertas');
        if (!alertaDiv) return;
        
        let alertas = [];
        if (niveis.casa < 20) alertas.push('⚠️ Casa com nível BAIXO!');
        if (niveis.cozinha < 20) alertas.push('⚠️ Cozinha com nível BAIXO!');
        if (niveis.casa > 95) alertas.push('✅ Casa com nível ALTO - Transbordamento iminente!');
        if (niveis.cozinha > 95) alertas.push('✅ Cozinha com nível ALTO - Transbordamento iminente!');
        
        if (alertas.length > 0) {
            alertaDiv.style.display = 'block';
            alertaDiv.innerHTML = alertas.join('<br>');
            alertaDiv.className = `alerta-nivel ${niveis.casa < 20 || niveis.cozinha < 20 ? 'alerta-baixo' : 'alerta-alto'}`;
        } else {
            alertaDiv.style.display = 'none';
        }
    }
    
    // Reset da simulação (volta aos valores iniciais)
    function resetarSimulacao() {
        niveis = {
            casa: 90,
            cozinha: 75
        };
        
        // Reseta históricos
        for (let i = 0; i < 7; i++) {
            historicoCasa[i] = gerarConsumoDia(i, 'casa');
            historicoCozinha[i] = gerarConsumoDia(i, 'cozinha');
            historicoConsumo[i] = {
                casa: historicoCasa[i],
                cozinha: historicoCozinha[i]
            };
        }
        
        atualizarDisplayNiveis();
        inicializarGraficos();
        verificarAlertas();
        
        // Feedback visual
        const btn = event.target;
        const textoOriginal = btn.innerText;
        btn.innerText = '✅ Resetado!';
        setTimeout(() => {
            btn.innerText = textoOriginal;
        }, 2000);
    }
    
    // ==========================================
    // LÓGICA DE CONTROLE DOS RELÉS
    // ==========================================
    
    function adicionarTempo(tipo, minutos) {
        const agora = Date.now();
        let base = (tempos[tipo] > agora) ? tempos[tipo] : agora;
        tempos[tipo] = base + (minutos * 60 * 1000);
        localStorage.setItem('tempo' + tipo, tempos[tipo]);
        atualizarPainel();
    }
    
    function desligar(tipo) {
        tempos[tipo] = 0;
        localStorage.setItem('tempo' + tipo, 0);
        atualizarPainel();
    }
    
    function formatarTempoExtenso(tempoFim) {
        const agora = Date.now();
        if (tempoFim <= agora) return "Desligado";
        
        let segundosTotais = Math.floor((tempoFim - agora) / 1000);
        const dias = Math.floor(segundosTotais / 86400);
        segundosTotais %= 86400;
        const horas = Math.floor(segundosTotais / 3600);
        segundosTotais %= 3600;
        const minutos = Math.floor(segundosTotais / 60);
        const segundos = segundosTotais % 60;
        
        let retorno = "";
        if (dias > 0) retorno += `${dias}d `;
        if (horas > 0 || dias > 0) retorno += `${horas.toString().padStart(2, '0')}h `;
        retorno += `${minutos.toString().padStart(2, '0')}m `;
        retorno += `${segundos.toString().padStart(2, '0')}s`;
        
        return retorno;
    }
    
    function atualizarPainel() {
        ['Bomba', 'Concessionaria'].forEach(tipo => {
            const display = document.getElementById(`display-${tipo.toLowerCase()}`);
            if (display) {
                const formatado = formatarTempoExtenso(tempos[tipo]);
                display.innerText = formatado;
                display.style.color = (formatado === "Desligado") ? "#ef4444" : "#4ade80";
            }
        });
    }
    
    // ==========================================
    // INICIALIZAÇÃO E LOOP PRINCIPAL
    // ==========================================
    
    // Inicializa tudo
    inicializarHistorico();
    inicializarGraficos();
    atualizarDisplayNiveis();
    verificarAlertas();
    
    // Loop de simulação (atualiza a cada 2 segundos)
    setInterval(() => {
        simularConsumo();
        atualizarPainel();
    }, 2000);
    
    // Loop dos relés (atualiza a cada segundo)
    setInterval(atualizarPainel, 1000);
    
    // Adiciona evento para salvar estado antes de fechar
    window.addEventListener('beforeunload', () => {
        localStorage.setItem('tempoBomba', tempos.Bomba);
        localStorage.setItem('tempoConcessionaria', tempos.Concessionaria);
    });
    
    console.log('✅ Sistema inicializado em MODO SIMULAÇÃO');
    console.log('📊 Gráficos:', Object.keys(charts).length, 'criados');
    console.log('💧 Níveis iniciais:', niveis);
</script>
</body>
</html>
