<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOIATO - Monitor de Nível d'Água</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f111a 0%, #1a1f2e 100%);
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .status-bar {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status.online {
            background: #10b981;
            color: white;
        }
        
        .status.offline {
            background: #ef4444;
            color: white;
        }
        
        .status.waiting {
            background: #f59e0b;
            color: white;
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        
        .card h2 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .tanque {
            position: relative;
            width: 120px;
            height: 180px;
            margin: 0 auto 20px;
            background: #0f172a;
            border: 3px solid #475569;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .agua {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(0deg, #3b82f6, #60a5fa);
            transition: height 0.5s ease;
            border-radius: 0 0 8px 8px;
        }
        
        .nivel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            z-index: 1;
        }
        
        .percent {
            font-size: 32px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 10px;
        }
        
        .label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
        
        .alerta {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            border-left: 4px solid #f59e0b;
        }
        
        .alerta.baixo {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        
        .alerta.alto {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .info {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }
        
        .timestamp {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 10px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💧 BOIATO</h1>
        <div class="subtitle">Sistema de Monitoramento de Nível d'Água</div>
        
        <div class="status-bar">
            <div id="status" class="status waiting">🔄 Conectando ao Firebase...</div>
        </div>
        
        <div class="cards">
            <div class="card">
                <h2>🏠 Caixa D'Água - Casa</h2>
                <div class="tanque">
                    <div class="agua" id="aguaCasa" style="height: 0%"></div>
                    <div class="nivel" id="nivelCasa">--%</div>
                </div>
                <div class="percent" id="percentCasa">--%</div>
                <div class="label">Nível atual</div>
            </div>
            
            <div class="card">
                <h2>🍽️ Caixa D'Água - Cozinha</h2>
                <div class="tanque">
                    <div class="agua" id="aguaCozinha" style="height: 0%"></div>
                    <div class="nivel" id="nivelCozinha">--%</div>
                </div>
                <div class="percent" id="percentCozinha">--%</div>
                <div class="label">Nível atual</div>
            </div>
        </div>
        
        <div id="alertas" style="display: none;"></div>
        
        <div class="timestamp" id="timestamp">
            Aguardando primeira atualização...
        </div>
        
        <div class="info">
            🔥 Dados em tempo real via Firebase Realtime Database<br>
            📡 Última atualização automática do ESP32
        </div>
    </div>

    <script>
        // Configuração do Firebase - USANDO SUAS CREDENCIAIS
        const firebaseConfig = {
            apiKey: "AIzaSyAItUzpEMFUeoS9fyrzq_xLPefeoy3nhxI",
            authDomain: "nivelcaixa-2dbd8.firebaseapp.com",
            databaseURL: "https://nivelcaixa-2dbd8-default-rtdb.firebaseio.com",
            projectId: "nivelcaixa-2dbd8",
            storageBucket: "nivelcaixa-2dbd8.firebasestorage.app",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Elementos DOM
        const statusDiv = document.getElementById('status');
        const aguaCasa = document.getElementById('aguaCasa');
        const nivelCasa = document.getElementById('nivelCasa');
        const percentCasa = document.getElementById('percentCasa');
        const aguaCozinha = document.getElementById('aguaCozinha');
        const nivelCozinha = document.getElementById('nivelCozinha');
        const percentCozinha = document.getElementById('percentCozinha');
        const timestampDiv = document.getElementById('timestamp');
        const alertasDiv = document.getElementById('alertas');

        // Variáveis
        let ultimaAtualizacao = null;

        // Função para formatar hora
        function formatarHora(timestamp) {
            if (!timestamp) return '--:--:--';
            const data = new Date(timestamp * 1000);
            return data.toLocaleTimeString('pt-BR');
        }

        // Função para atualizar a interface
        function atualizarInterface() {
            // Atualiza visual da Casa
            if (window.nivelCasa !== undefined) {
                const altura = Math.min(100, Math.max(0, window.nivelCasa));
                aguaCasa.style.height = altura + '%';
                nivelCasa.innerText = Math.round(altura) + '%';
                percentCasa.innerText = Math.round(altura) + '%';
            }
            
            // Atualiza visual da Cozinha
            if (window.nivelCozinha !== undefined) {
                const altura = Math.min(100, Math.max(0, window.nivelCozinha));
                aguaCozinha.style.height = altura + '%';
                nivelCozinha.innerText = Math.round(altura) + '%';
                percentCozinha.innerText = Math.round(altura) + '%';
            }
            
            // Verificar alertas
            verificarAlertas();
        }
        
        // Função para verificar alertas de nível
        function verificarAlertas() {
            const alertas = [];
            
            if (window.nivelCasa !== undefined) {
                if (window.nivelCasa < 20) {
                    alertas.push('⚠️ ALERTA: Caixa da Casa está com nível BAIXO!');
                } else if (window.nivelCasa > 95) {
                    alertas.push('✅ ATENÇÃO: Caixa da Casa está quase CHEIA!');
                }
            }
            
            if (window.nivelCozinha !== undefined) {
                if (window.nivelCozinha < 20) {
                    alertas.push('⚠️ ALERTA: Caixa da Cozinha está com nível BAIXO!');
                } else if (window.nivelCozinha > 95) {
                    alertas.push('✅ ATENÇÃO: Caixa da Cozinha está quase CHEIA!');
                }
            }
            
            if (alertas.length > 0) {
                alertasDiv.style.display = 'block';
                alertasDiv.className = 'alerta ' + (window.nivelCasa < 20 || window.nivelCozinha < 20 ? 'baixo' : 'alto');
                alertasDiv.innerHTML = alertas.join('<br>');
            } else {
                alertasDiv.style.display = 'none';
            }
        }

        // ==========================================
        // CONEXÃO COM FIREBASE EM TEMPO REAL
        // ==========================================
        
        // Escutar mudanças no nível da Casa
        const casaRef = database.ref('niveis/casa');
        casaRef.on('value', (snapshot) => {
            const nivel = snapshot.val();
            if (nivel !== null) {
                window.nivelCasa = nivel;
                atualizarInterface();
                
                // Atualiza status
                statusDiv.innerHTML = '✅ Conectado ao Firebase';
                statusDiv.className = 'status online';
            }
        }, (error) => {
            console.error('Erro na leitura da Casa:', error);
            statusDiv.innerHTML = '⚠️ Erro de conexão';
            statusDiv.className = 'status offline';
        });

        // Escutar mudanças no nível da Cozinha
        const cozinhaRef = database.ref('niveis/cozinha');
        cozinhaRef.on('value', (snapshot) => {
            const nivel = snapshot.val();
            if (nivel !== null) {
                window.nivelCozinha = nivel;
                atualizarInterface();
            }
        });

        // Escutar timestamp da última atualização
        const timestampRef = database.ref('niveis/ultima_atualizacao');
        timestampRef.on('value', (snapshot) => {
            const timestamp = snapshot.val();
            if (timestamp !== null) {
                ultimaAtualizacao = timestamp;
                timestampDiv.innerHTML = `📡 Última atualização: ${formatarHora(timestamp)}`;
            }
        });
        
        // Timeout para mostrar que está aguardando dados
        setTimeout(() => {
            if (window.nivelCasa === undefined && window.nivelCozinha === undefined) {
                statusDiv.innerHTML = '⏳ Aguardando dados do ESP32...';
                statusDiv.className = 'status waiting';
                timestampDiv.innerHTML = 'Aguardando primeiro envio de dados do ESP32...';
            }
        }, 3000);
        
        console.log('✅ Sistema inicializado - Aguardando dados do Firebase');
    </script>
</body>
</html>
